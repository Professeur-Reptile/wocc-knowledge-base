# Job JETABLE — supprimé juste après ce passage.
#
# Huit workflows de sondage écrits en juillet 2026 pour explorer les données du
# jeu (probe-*, explore-game-*, update-extract) n'existaient plus dans aucune
# branche, mais restaient listés dans l'onglet Actions tant que leurs anciennes
# exécutions subsistaient. Ce job les a effacées, puis efface les siennes pour
# ne pas prendre leur place dans la liste.
#
# Il ne touche QUE les noms listés ci-dessous ; les deux workflows utiles du
# repo (update-knowledge-base et deploy-pages) n'y sont pas.

name: Nettoyer les workflows jetables

on:
  # Se déclenche sur sa propre modification : le dispatch manuel n'est pas
  # accessible au jeton de la session qui l'a écrit.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-workflows.yml'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Effacer les exécutions des sondes de juillet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          JETABLES="probe-guild.yml probe-loot.yml probe-talents.yml update-extract.yml explore-game-harvest.yml explore-game-icons.yml explore-game-professions.yml explore-game-stats.yml"
          total=0
          for f in $JETABLES; do
            id=$(gh api "repos/$REPO/actions/workflows" --paginate \
                 --jq ".workflows[] | select(.path == \".github/workflows/$f\") | .id" | head -1)
            if [ -z "$id" ]; then
              echo "$f : déjà absent."
              continue
            fi
            n=0
            for run in $(gh api "repos/$REPO/actions/workflows/$id/runs?per_page=100" --jq '.workflow_runs[].id'); do
              gh api -X DELETE "repos/$REPO/actions/runs/$run"
              n=$((n + 1))
            done
            total=$((total + n))
            echo "$f : $n exécution(s) effacée(s)."
          done
          echo "Total : $total exécution(s) effacée(s)."

      # Dernière étape : ce job ne doit pas remplacer dans la liste ceux qu'il
      # vient d'en retirer. On efface d'abord les passages précédents, puis
      # celui-ci — après quoi le runner peut s'interrompre, le travail est fait.
      - name: Effacer ses propres traces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for run in $(gh api "repos/$REPO/actions/workflows/cleanup-workflows.yml/runs?per_page=100" \
                       --jq '.workflow_runs[].id'); do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$run" && echo "passage précédent $run effacé."
          done
          echo "Effacement du passage courant ($GITHUB_RUN_ID)."
          gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" || true
