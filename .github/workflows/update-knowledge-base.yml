# Se déclenche automatiquement à chaque nouvelle release publiée sur
# levy-street/world-of-claudecraft, régénère les données du jeu en JSON,
# et commite le résultat dans CE repo (le tien, dédié à la knowledge base).
#
# Pour que ça marche, ce fichier doit vivre dans un repo GitHub qui t'appartient
# (pas dans le repo du jeu lui-même, sur lequel tu n'as pas la main).
#
# Deux façons de le déclencher :
#   1. "repository_dispatch" : le plus fiable, mais demande un petit relais
#      (voir note en bas de fichier) car GitHub ne permet pas nativement de
#      s'abonner aux releases d'un AUTRE repo que le tien.
#   2. "schedule" : plus simple à mettre en place. Ce fichier utilise cette
#      option, réglée sur 5 minutes — le minimum autorisé par GitHub pour un
#      cron planifié (impossible d'aller plus vite sans un vrai webhook).
#
# IMPORTANT : à 5 minutes d'intervalle, on ne peut PAS se permettre de
# retélécharger l'archive complète du jeu (~230 Mo) à chaque passage — ça
# gaspillerait bande passante et minutes Actions pour rien la plupart du
# temps. Le job est donc coupé en deux étapes : une vérification légère du
# tag (quelques octets, via l'API GitHub) qui tourne à chaque déclenchement,
# et l'extraction lourde qui ne se lance QUE si le tag a changé.

name: Update WoCC knowledge base

on:
  schedule:
    - cron: '0/30 * * * *'    # toutes les 5 minutes (minimum autorisé par GitHub)
  workflow_dispatch: {}      # bouton "Run workflow" manuel dans l'onglet Actions

# Le job "check" n'a besoin que de lire le repo ; seul "update" élève ses
# permissions (bloc dédié plus bas).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
    steps:
      - name: Checkout ce repo (pour lire le dernier tag connu)
        uses: actions/checkout@v4

      - name: Comparer le tag connu au dernier tag publié (requête légère)
        id: check
        env:
          # Fourni automatiquement par GitHub Actions, aucune config requise.
          # Sans ce token, la limite tombe à 60 requêtes/heure PAR ADRESSE IP —
          # partagée entre tous les workflows tournant sur les runners GitHub
          # au même moment, donc risquée à ce rythme. Avec le token : 5000/h.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KNOWN_TAG="none"
          KNOWN_SCHEMA="0"
          if [ -f data/_meta.json ]; then
            KNOWN_TAG=$(node -p "require('./data/_meta.json').tag")
            KNOWN_SCHEMA=$(node -p "require('./data/_meta.json').schema || 0")
          fi
          # Version du schéma d'extraction : si le pipeline s'enrichit
          # (nouveaux registres extraits), les données doivent être refaites
          # même sans nouveau tag du jeu.
          WANT_SCHEMA=$(node -p "require('./package.json').kbSchema || 0")
          # Le commit du tag, pas seulement son nom. Précaution, pas correctif :
          # un tag re-poussé garde son nom et l'archive codeload suit le
          # nouveau commit, donc une comparaison par nom seul laisserait la KB
          # figée sur les anciennes données. Aucun re-tag observé à ce jour —
          # ajouté le 7 août 2026 après une FAUSSE alerte (j'avais lu une copie
          # locale périmée et cru la KB en retard ; elle était juste).
          KNOWN_SHA=""
          if [ -f data/_meta.json ]; then
            KNOWN_SHA=$(node -p "require('./data/_meta.json').sha || ''")
          fi
          LATEST_JSON=$(curl -s "https://api.github.com/repos/levy-street/world-of-claudecraft/tags?per_page=1" \
            -H "User-Agent: wocc-knowledge-pipeline" \
            -H "Authorization: Bearer $GH_TOKEN")
          LATEST_TAG=$(printf '%s' "$LATEST_JSON" | node -p "JSON.parse(require('fs').readFileSync(0))[0].name")
          LATEST_SHA=$(printf '%s' "$LATEST_JSON" | node -p "JSON.parse(require('fs').readFileSync(0))[0].commit.sha")
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          if [ "$LATEST_TAG" == "$KNOWN_TAG" ] && [ "$LATEST_SHA" == "$KNOWN_SHA" ] && [ "$WANT_SCHEMA" == "$KNOWN_SCHEMA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # pour relancer le déploiement Pages (étape finale)
    steps:
      - name: Checkout ce repo (la knowledge base)
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances du pipeline
        run: npm install esbuild --no-save

      # Le nom du tag vient d'un repo tiers : il passe par une variable
      # d'environnement (jamais interpolé directement dans le script), sinon
      # un nom de tag piégé pourrait exécuter des commandes sur le runner.
      - name: Extraire les données du nouveau tag (${{ needs.check.outputs.latest_tag }})
        env:
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          GAME_TAG_SHA: ${{ needs.check.outputs.latest_sha }}
        run: node scripts/extract.mjs "$LATEST_TAG" ./data

      - name: Commiter les nouvelles données
        env:
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
        run: |
          git config user.name "wocc-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "chore: update knowledge base to $LATEST_TAG"
          git push

      # Rien à publier ici : le miroir GitHub Pages a été retiré le 6 août 2026
      # (il échouait 2 fois sur 3), et deploy-pages.yml avec lui. Le Codex est
      # servi sous /codex/ par le déploiement OVH de La-Clauderie, qui recopie
      # ce repo à chaque push sur son main et via son cron de 6 h.
      #
      # L'étape qui subsistait ici — « gh workflow run deploy-pages.yml » —
      # faisait échouer le job à CHAQUE nouvelle version du jeu, en HTTP 422
      # (« Workflow does not have workflow_dispatch trigger »), APRÈS que les
      # données aient été extraites et poussées : le mail d'échec annonçait
      # donc un problème qui n'existait pas. Retirée le 11 août 2026.

# -----------------------------------------------------------------------------
# Note sur l'option 1 (déclenchement immédiat à la release, au lieu d'attendre
# le prochain passage du cron) : GitHub ne permet pas de t'abonner directement
# aux releases d'un repo qui n'est pas le tien. Il faut soit :
#   - Un petit relais (une Cloud Function / un Zapier / un webhook GitHub sur
#     le repo du jeu, si ses mainteneurs t'y autorisent) qui appelle l'API
#     "repository_dispatch" de TON repo à chaque release.
#   - Ou simplement vivre avec le délai du cron (5 min ici) : dans les faits,
#     GitHub ne garantit pas une exécution pile à l'heure programmée en
#     période de forte charge, donc compte plutôt sur un délai de quelques
#     minutes à un quart d'heure dans le pire des cas — largement suffisant
#     pour ce cas d'usage.
# -----------------------------------------------------------------------------

